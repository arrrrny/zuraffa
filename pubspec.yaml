name: zuraffa
description: AI first Clean Architecture Framework and CLI with Result types, UseCase patterns, Dependency Injection and MCP server for building type-safe, scalable apps with AI agents.
version: 6.0.0
homepage: https://zuraffa.com
repository: https://github.com/arrrrny/zuraffa
issue_tracker: https://github.com/arrrrny/zuraffa/issues
documentation: https://github.com/arrrrny/zuraffa#readme

topics:
  - clean-architecture
  - state-management
  - dependency-injection
  - architecture
  - code-generation

environment:
  sdk: ^3.11.0

dependencies:
  args: ^2.7.0
  logging: ^1.3.0
  path: ^1.9.1
  yaml: ^3.1.0
  uuid: ^4.6.0
  zorphy:
    git:
      url: https://github.com/arrrrny/zorphy.git
      path: zorphy
      # Issue #310: points to the fix branch carrying BOTH the original
      # #82/#310 plain-type fix (5ef9dc3 + faf94de, already on
      # zorphy/development) AND the comment-safety hardening that strips
      # `//` and `/* */` comments before the `abstract class $X` regex
      # match. Without the comment strip, a doc comment in a hand-written
      # class file mentioning `abstract class $X` would falsely match and
      # re-emit the `$` prefix -> InvalidType in the concrete class.
      # Revert to "development" once
      # https://github.com/arrrrny/zorphy/pull/85 (the comment-safety
      # hardening) is merged into zorphy/development.
      ref: "fix/310-determine-prefix-comment-safe"
  zorphy_annotation:
    git:
      url: https://github.com/arrrrny/zorphy.git
      path: zorphy_annotation
      ref: "development"

  json_annotation: ^4.12.0

  http: ^1.6.0
  minio: ^3.5.8
  opentelemetry: ^0.18.11
  code_builder: ^4.11.1
  dart_style: ^3.1.12
  analyzer: 14.1.0
  graphql: ^5.2.3
  gql: ^1.0.1

  json_serializable: ^6.13.2
  get_it: ^9.2.1
  meta: ^1.17.0
  glob: ^2.1.2
  hive_ce: ^2.3.4

dependency_overrides:
  analyzer: 14.1.0
  zorphy:
    path: ../zorphy/zorphy
  zorphy_annotation:
    path: ../zorphy/zorphy_annotation

executables:
  zuraffa:
  zfa:
  zuraffa_mcp_server:

dev_dependencies:
  test: ^1.25.0
  build_runner: ^2.15.2
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
