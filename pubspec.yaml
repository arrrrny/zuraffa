name: zuraffa
description: AI first Clean Architecture Framework and CLI with Result types, UseCase patterns, Dependency Injection and MCP server for building type-safe, scalable apps with AI agents.
version: 7.2.0
homepage: https://zuraffa.com
repository: https://github.com/arrrrny/zuraffa
issue_tracker: https://github.com/arrrrny/zuraffa/issues
documentation: https://github.com/arrrrny/zuraffa#readme

topics:
  - clean-architecture
  - state-management
  - dependency-injection
  - architecture
  - code-generation

environment:
  sdk: ^3.11.0

dependencies:
  args: ^2.7.0
  logging: ^1.3.0
  path: ^1.9.1
  yaml: ^3.1.4
  uuid: ^4.6.0
  zorphy: ^2.4.1
  zorphy_annotation: ^2.4.1

  json_annotation: ^4.12.0

  # 027-agent-policy-shell: tool-gating/budget/trace hooks hash tool-call
  # arguments by default (FR-008). Already present in the transitive
  # resolution graph via uuid; declared here as a direct dep.
  crypto: ^3.0.7

  http: ^1.6.0
  code_builder: ^4.12.0
  dart_style: ^3.1.13
  # Issue #1189: lower bound widened from ^14.3.0 so Flutter-consumer graphs
  # that cap analyzer in the 14.0-14.2 range can still resolve. analyzer MUST
  # stay a REGULAR dependency: lib/zuraffa.dart publicly exports
  # src/core/ast/* (ast_helper, file_parser, ast_modifier, node_finder), which
  # hard-import package:analyzer — every consumer compiles these sources, so a
  # dev_dependencies move would break consumers at compile time.
  # Issue #1986: the RESOLVED analyzer version is pinned by the committed
  # pubspec.lock (it is no longer gitignored) — the caret range alone let
  # every analyzer release land on master untested (14.6.0 replaced the
  # `undefined_getter` diagnostic and broke the build — issue #1980).
  # Bump deliberately: `dart pub get --no-example && git add pubspec.lock`.
  #
  # SDK FLOOR of the LOCK: the locked analyzer 14.6.0 declares
  # `sdk: ^3.13.0`, so this repository's OWN lanes must run Dart >= 3.13.0
  # (pubspec.lock -> sdks: dart: ">=3.13.0 <4.0.0"). CI pins Dart 3.13.3
  # and resolves with `--enforce-lockfile`, so a drifted lock fails loudly
  # instead of silently re-resolving (issue #1986 review). Bumping the lock
  # therefore requires Dart >= 3.13.0 — run the bump on 3.13.x.
  #
  # The PUBLISHED package's own floor stays `environment: sdk: ^3.11.0` on
  # purpose: pub IGNORES a dependency's lockfile, so a consumer on Dart
  # 3.11/3.12 still resolves analyzer 14.5.x (its sdk floor is ^3.11.0)
  # inside this same `^14.4.0` constraint — raising the published floor
  # would break those consumers for a pin that does not reach them.
  analyzer: ^14.4.0

  # Sync plugin: hive_ce 2.20.0+ required for Box API used in SyncMetadataStore
  hive_ce: ^2.20.0
  get_it: ^9.2.1
  meta: ^1.19.0
  glob: ^2.2.0
  # 020-skeleton-plugin: tar.gz export for bone artifacts (FR-006).
  archive: ^4.3.0

  # TUI plugin (specs/017-tui-plugin): pure-Dart terminal UI engine.
  # nocterm has NO package:flutter dependency (verified via pub.dev metadata).
  # Any future Flutter-only rendering path MUST live in zuraffa_flutter, never
  # in this pure-Dart TUI plugin path (FR-012).
  nocterm: ^0.9.0

  # Issue #1112 (zfa skin drive): the CLI drives the live app's
  # debugTapAnchorJson seam over the Dart VM service. vm_service is
  # pure Dart (no Flutter import — Constitution VII holds) and was
  # already in the transitive graph; it is a DIRECT dependency now
  # because lib/src/skin/driver/vm_tap_driver.dart imports it.
  vm_service: ^15.3.0

# dependency_overrides intentionally removed per spec 018-cli-plugin task
# instructions ("delete the entire dependency_overrides: section"). The
# previous section pinned analyzer: 14.1.0, which is already an exact version
# pin in the dependencies: block above, so removal is a no-op for resolution
# and eliminates any path-override risk for CI. Do NOT reintroduce path:
# overrides — CI has no sibling checkouts and every branch goes red when
# they are present.
executables:
  zuraffa:
  zfa:
  zuraffa_mcp_server:

dev_dependencies:
  # Issue #1189: `test` is dev-only. As a REGULAR dependency it made every
  # Flutter consumer unresolvable: flutter_test pins test_api 0.7.12 and
  # matcher 0.12.20, and NO published `test` version is compatible with
  # those pins once graphql ^5.2.3 (web_socket_channel ^3.0.1) is in the
  # graph — `dart pub get` failed with "zuraffa from path is incompatible
  # with flutter_test from sdk". lib/src only references package:test inside
  # string templates for GENERATED consumer projects (those write test into
  # their own dev_dependencies); the lib/tdd/** self-hosting subjects resolve
  # against THIS package's dev_dependencies.
  test: ^1.32.0
  build_runner: ^2.16.1
  # Codegen generator for json_annotation-annotated sources; consumed via
  # build_runner only — dev-only (nothing in lib/ or bin/ imports it).
  json_serializable: ^6.14.1
  lints: ^6.1.0
  # mutation_test: wired in by spec 041 follow-up (Phase 11, tasks T077-T081)
  # to drive the `zfa tdd verify` mutation phase honestly — no spot-check
  # fallback. The config at `mutation-test.xml` scopes mutations to the TDD
  # plugin + writers introduced by feature 041 so the full suite isn't run
  # per mutant (which would be 2400+ test executions per mutant and would
  # not fit the rubric's "<10s per mutant" budget).
  mutation_test: ^1.8.0
