name: zuraffa
description: AI first Clean Architecture Framework and CLI with Result types, UseCase patterns, Dependency Injection and MCP server for building type-safe, scalable apps with AI agents.
version: 6.0.0
homepage: https://zuraffa.com
repository: https://github.com/arrrrny/zuraffa
issue_tracker: https://github.com/arrrrny/zuraffa/issues
documentation: https://github.com/arrrrny/zuraffa#readme

topics:
  - clean-architecture
  - state-management
  - dependency-injection
  - architecture
  - code-generation

environment:
  sdk: ^3.11.0

dependencies:
  args: ^2.7.0
  logging: ^1.3.0
  path: ^1.9.1
  yaml: ^3.1.0
  uuid: ^4.6.0
  zorphy: ^2.0.0
  zorphy_annotation: ^2.0.0

  json_annotation: ^4.12.0

  http: ^1.6.0
  minio: ^3.5.8
  opentelemetry: ^0.18.11
  code_builder: ^4.11.1
  dart_style: ^3.1.12
  analyzer: 14.1.0
  graphql: ^5.2.3
  gql: ^1.0.1

  json_serializable: ^6.13.2
  get_it: ^9.2.1
  meta: ^1.17.0
  glob: ^2.1.2
  hive_ce: ^2.3.4

dependency_overrides:
  analyzer: 14.1.0
  # DEV-MODE PATH OVERRIDES (local zorphy checkout = the authoritative dev
  # source; instant iteration on zorphy fixes without waiting for pub.dev
  # releases or git ref resolution). Ship/prepare flows must switch back to
  # the hosted ^2.0.0 constraint (no overrides) — see PUBLISH.md.
  zorphy:
    path: /workspace/zorphy/zorphy
  zorphy_annotation:
    path: /workspace/zorphy/zorphy_annotation

executables:
  zuraffa:
  zfa:
  zuraffa_mcp_server:

dev_dependencies:
  test: ^1.25.0
  build_runner: ^2.15.2
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
