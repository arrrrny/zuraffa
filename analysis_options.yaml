include: package:lints/recommended.yaml

linter:
  rules:
    library_names: true
    avoid_empty_else: true
    avoid_print: false
    constant_identifier_names: false
    overridden_fields: false
analyzer:
  exclude:
    # GYM scripts follow the issue's `<id>-<name>.dart` rep format
    # (e.g. 01-deps.dart, 02-build.dart) — see issue #397. They are
    # standalone `dart run` scripts graded by the miki GYM runner, not
    # part of the package's compiled surface, so they live outside the
    # package's strict lint regime.
    - .gym/**
    # Spec 025 reference examples: independently-resolved sub-packages
    # (their own pubspecs + path deps). Analyzed and tested from inside
    # their own directories (`dart analyze` / `dart test` there — see
    # specs/025 tdd/verification.md); excluded here because the root
    # context has no package_config for their package: URIs.
    - examples/notes_package/**
    - examples/reference_package_app/**
    # mcp_demo: standalone example package (own pubspec + path deps); the
    # root context cannot resolve its package: URIs, surfacing as
    # uri_does_not_exist / undefined_identifier errors. Analyzed from inside
    # its own directory, excluded from the root analyze pass.
    - examples/mcp_demo/**
    # Slice plugin fixture (spec 043): a standalone Flutter-convention app
    # (imports package:flutter / package:get_it the root context cannot
    # resolve). It is test DATA read by the slice engine, never compiled or
    # analyzed as part of this package.
    - test/fixtures/slice_test_project/**
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  errors:
    deprecated_member_use_from_same_package: ignore
    deprecated_member_use: ignore
    invalid_use_of_visible_for_overriding_member: ignore
    # Test files attach @Tags/@Timeout annotations at the top without a
    # `library;` directive by design; this info-only lint would otherwise
    # flag every tagged test file.
    library_annotations: ignore
    # Internal DDA/route compiler classes expose getters typed with private
    # element types; this is internal API, not a public contract.
    library_private_types_in_public_api: ignore
    # Generated-templating doc comments intentionally show `<T>` generics;
    # wrapping every angle bracket in backticks would hurt readability.
    unintended_html_in_doc_comment: ignore
enable-experiment:
  - extension-methods
