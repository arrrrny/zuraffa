name: zuraffa_observability
description: OpenTelemetry capability for Zuraffa — tracer, failure reporter, telemetry hook, and the simulation span capture (optional companion package; issue #1661).
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.11.0

dependencies:
  opentelemetry: ^0.18.11
  zuraffa:
    path: ../..
  logging: ^1.3.0

dev_dependencies:
  test: ^1.25.0
