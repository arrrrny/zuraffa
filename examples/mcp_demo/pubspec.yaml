name: mcp_demo
description: Example Zuraffa app exposing fetch/printPdf/takeScreenshot as MCP tools (issue #369).
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  zuraffa:
    path: ../../

dev_dependencies:
  test: ^1.25.0

# Fleet dev policy: xml pinned to the latest release; sibling fleet
# checkouts resolve not-yet-published constraints locally.
# dependency_overrides are stripped on publish.
dependency_overrides:
  xml: 7.1.0
