# Zuraffa-native package created by `zfa package create` (spec 025).
name: notes_package
description: "Spec 025 reference: one entity, one datasource, one usecase, one agent tool, module + registrar."
version: 7.3.6
publish_to: none

environment:
  sdk: ^3.11.0

dependencies:
  zuraffa:
    path: ../..
  zorphy: ^2.3.0
  zorphy_annotation: ^2.3.0

dev_dependencies:
  build_runner: ^2.15.2
  test: ^1.25.0

# Fleet dev policy: xml pinned to the latest release; sibling fleet
# checkouts resolve not-yet-published constraints locally.
# dependency_overrides are stripped on publish.
dependency_overrides:
  xml: 7.1.0
