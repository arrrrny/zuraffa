name: reference_package_app
description: Spec 025 demo app — consumes examples/notes_package via its package module (auto-DI, lifecycle, namespaced agent tools).
version: 7.4.2
publish_to: none

environment:
  sdk: ^3.11.0

dependencies:
  notes_package:
    path: ../notes_package
  zuraffa:
    path: ../..

dev_dependencies:
  test: ^1.25.0

# Fleet dev policy: xml pinned to the latest release; sibling fleet
# checkouts resolve not-yet-published constraints locally.
# dependency_overrides are stripped on publish.
dependency_overrides:
  xml: 7.1.0
