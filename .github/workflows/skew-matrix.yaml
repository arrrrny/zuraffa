name: Skew Matrix

# Issue #1197 (part of #908 P0): the generator/runtime version-skew
# contract, enforced continuously.
#
# - two-end-matrix: a slice generated by the CURRENT generator must
#   compile against the OLDEST supported core (git tag v6.1.0,
#   materialized via `git archive`) AND the newest master; the floor
#   gates must refuse skin emission on the old end; the make receipt
#   must carry the skew stamps. Runs the fast in-repo contract tests
#   (test/skew) plus tools/run_skew_matrix.sh for the real
#   pub-get-and-analyze legs.
#
# - flutter-smoke-gate: the #1189 tripwire — a regular-dep bump in
#   pubspec.yaml (the analyzer family, historically) can break FLUTTER
#   resolution while pure-Dart consumers stay green. A minimal Flutter
#   consumer resolves (`flutter pub get`) and compiles
#   (`flutter analyze`) against the candidate core before anything
#   ships. Also wired as a pre-publish gate in release.yml.

on:
  pull_request:
    paths:
      - "lib/**"
      - "bin/**"
      - "pubspec.yaml"
      - "tools/run_skew_matrix.sh"
      - "tools/flutter_consumer_smoke.sh"
      - ".github/workflows/skew-matrix.yaml"
  workflow_dispatch:

env:
  flutter_version: "3.47.x"
  java_version: "21.x"

jobs:
  two-end-matrix:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `git archive v6.1.0` needs the tag objects.
          fetch-depth: 0
      - name: Configuring Dart environment
        uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.13.2"
      - name: "Get dependencies"
        run: dart pub get --no-example
      - name: "Skew contract tests (fast, in-repo)"
        run: dart test test/skew
      - name: "Two-end skew matrix (real compile legs)"
        run: tools/run_skew_matrix.sh

  flutter-smoke-gate:
    # The #1189 constraint-hygiene gate: break the build here, not in
    # a published consumer's pub solve.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.java_version }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.flutter_version }}
          channel: stable
          cache: true
      - name: "Flutter-consumer smoke gate (resolution + compile)"
        run: tools/flutter_consumer_smoke.sh
