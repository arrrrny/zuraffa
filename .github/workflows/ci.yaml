name: Continuous Integration

on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:

env:
  flutter_version: "3.41.x"
  java_version: "21.x"
  dart_sdk_version: ">=3.0.0 <4.0.0"

jobs:
  dart_core:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configuring Dart environment
        uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.13.1"
      - name: "Get dependencies"
        run: dart pub get
      - name: "Dart Analyze (pure Dart, no Flutter)"
        # Scoped to the root package (lib/ + test/). The root package is
        # pure Dart; zuraffa_flutter is a separate Flutter package and must
        # not be analyzed here (it has its own flutter analyze in
        # flutter_package). --no-fatal-warnings keeps non-blocking infos
        # from failing the build.
        run: dart analyze lib test --no-fatal-warnings
      - name: "Dart Test (pure Dart, no Flutter)"
        run: dart test test
      - name: "zikzak_session: Get dependencies"
        run: dart pub get
        working-directory: ./zikzak_session
      - name: "zikzak_session: Analyze"
        run: dart analyze --no-fatal-warnings
        working-directory: ./zikzak_session
      - name: "zikzak_session: Test"
        run: dart test
        working-directory: ./zikzak_session

  analyze:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configuring java
        uses: actions/setup-java@v1
        with:
          java-version: ${{ env.java_version }}
      - name: Configuring flutter environment
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.flutter_version }}
          channel: "stable"
      - name: "Get dependencies"
        run: flutter packages get
      - name: "Dart Analyze"
        # Root package only (lib/ + test/). This job covers the pure-Dart
        # root package under the Flutter SDK. --no-fatal-infos/--no-fatal-warnings
        # keep non-blocking lint infos from failing the build.
        run: flutter analyze lib test --no-fatal-infos --no-fatal-warnings

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configuring java
        uses: actions/setup-java@v1
        with:
          java-version: ${{ env.java_version }}
      - name: Configuring flutter environment
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.flutter_version }}
          channel: "stable"
      - name: "Get dependencies"
        run: flutter packages get
      - name: "Formatter"
        # Root package only (lib/ + test/).
        run: dart format --set-exit-if-changed lib test

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configuring java
        uses: actions/setup-java@v1
        with:
          java-version: ${{ env.java_version }}
      - name: Configuring flutter environment
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.flutter_version }}
          channel: "stable"
      - name: "Get dependencies"
        run: flutter packages get
      - name: "Flutter Core Test"
        run: flutter test --coverage
      - name: "Upload coverage to Codecov"
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
