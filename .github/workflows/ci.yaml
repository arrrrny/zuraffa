name: Continuous Integration

on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:

env:
  flutter_version: "3.41.x"
  java_version: "21.x"
  dart_sdk_version: ">=3.0.0 <4.0.0"

jobs:
  dart_core:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configuring Dart environment
        uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.13.1"
      - name: "Get dependencies"
        run: dart pub get --no-example
      - name: "Dart Analyze (pure Dart, no Flutter)"
        # Scoped to the root package (lib/ + test/). The root package is
        # pure Dart; zuraffa_flutter is a separate Flutter package and must
        # not be analyzed here (it has its own flutter analyze in
        # flutter_package). --no-fatal-warnings keeps non-blocking infos
        # from failing the build.
        run: dart analyze lib test --no-fatal-warnings
      - name: "Dart Test (pure Dart, no Flutter)"
        # Exclude the Flutter-generation tests (tagged `flutter`); those are
        # covered by the `test` (flutter) job below. This keeps `dart_core` a
        # true pure-Dart suite that runs on the Dart SDK only.
        run: dart test test --exclude-tags flutter

  analyze:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configuring java
        uses: actions/setup-java@v1
        with:
          java-version: ${{ env.java_version }}
      - name: Configuring flutter environment
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.flutter_version }}
          channel: "stable"
      - name: "Get dependencies"
        run: flutter packages get --no-example
      - name: "Dart Analyze"
        # Root package only (lib/ + test/). This job covers the pure-Dart
        # root package under the Flutter SDK. --no-fatal-infos/--no-fatal-warnings
        # keep non-blocking lint infos from failing the build.
        run: flutter analyze lib test --no-fatal-infos --no-fatal-warnings

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # dart format needs only the Dart SDK (not Flutter). Pin the same SDK
      # as dart_core so the formatter matches the version used to format the
      # tree locally; otherwise a Flutter-bundled Dart would flag drift.
      - name: Configuring Dart environment
        uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.13.1"
      - name: "Get dependencies"
        # Required so dart format can resolve analysis_options.yaml's
        # `package:lints/recommended.yaml` include; without a package
        # config it falls back to default formatting rules and flags drift.
        run: dart pub get --no-example
      - name: "Formatter"
        # Root package only (lib/ + test/).
        run: dart format --set-exit-if-changed lib test

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configuring java
        uses: actions/setup-java@v1
        with:
          java-version: ${{ env.java_version }}
      - name: Configuring flutter environment
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.flutter_version }}
          channel: "stable"
      - name: "Get dependencies"
        run: flutter packages get --no-example
      - name: "Flutter Test (Flutter-generation only)"
        # Runs only the Flutter-generation tests (tagged `flutter`). `flutter
        # test` does NOT support `--preset`, so we select them directly with
        # `--tags flutter`. The pure-Dart fast tier is covered by `dart_core`;
        # this job verifies that zuraffa's *generated* Flutter output actually
        # compiles/runs. It must NOT run the whole suite (that is
        # `dart test --preset=all`, which spins up temp projects that exhaust
        # disk/RAM on small agents).
        run: flutter test --tags flutter --coverage
      - name: "Upload coverage to Codecov"
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
