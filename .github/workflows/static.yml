name: Deploy Static Site to GitHub Pages

on:
  push:
    branches:
      - master
    paths:
      - 'website/**'
      - '.zread/**'
      - 'tools/sync-website-docs.sh'
      - '.github/workflows/static.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Sync docs from zread wiki
        run: bash tools/sync-website-docs.sh

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/static

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
