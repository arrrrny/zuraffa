# SPEC 917 — the conformance gate (issue #917, VISION §3+§4 made mechanical).
#
# The treaty is enforced in CI on every push and PR to master:
#   1. `zfa manifest --verify` certifies manifest inputSchemas ↔ CLI flags ↔
#      help text across every CLI-aware plugin (drift exits 3 — the canonical
#      contract-drift code).
#   2. The golden-table test asserts the exit-code protocol (0/1/2/3/4) and
#      the machine-actionable `--> fix:` line contract against the LIVE CLI.
#   3. `--json`/`--stream` machine-verdict coverage is asserted for every
#      tdd/corpus verb (the four laggards included).
#
# The exit-code golden table is asserted by the test suite, not greps — the
# gate runs the same tests CI already runs, plus the live gate itself.
name: conformance

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  treaty:
    name: manifest --verify + exit protocol golden table
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        # --no-example: this job only uses dart-lang/setup-dart (no Flutter
        # SDK). example/ depends on flutter_test from sdk, which fails to
        # resolve under a pure-Dart SDK; every other workflow scopes pub get
        # the same way (see ci.yaml, skew-matrix.yaml).
        run: dart pub get --no-example

      - name: Analyze
        # Scoped to the root package (lib/ + test/ + bin/): an unscoped
        # `dart analyze` also walks the nested example packages
        # (examples/todo_tdd resolves `package:todo_tdd` against the ROOT
        # package config and reports 31 pre-existing uri errors — verified
        # identical on master). Every other workflow scopes the same way
        # (see ci.yaml, skew-matrix.yaml).
        run: dart analyze lib test bin

      - name: The treaty gate — manifest --verify (drift exits 3)
        run: dart run bin/zfa.dart manifest --verify

      - name: The treaty gate in JSON (manifest-verify.v1, ok:true, exit 0)
        run: |
          dart run bin/zfa.dart manifest --verify --format json > verify.json
          cat verify.json
          # One machine-verifiable document: schema + ok + exit_code 0.
          grep -q '"schema":"manifest-verify.v1"' verify.json
          grep -q '"ok":true' verify.json
          grep -q '"exit_code":0' verify.json

      - name: Exit-code protocol — the golden table (0/1/2/3/4)
        run: dart test test/commands/exit_protocol_golden_test.dart

      - name: Manifest gate tests (#904 seed fixtures, drift = 3)
        run: dart test test/commands/manifest_verify_gate_test.dart

      - name: Machine verdicts — --json everywhere + --stream NDJSON
        run: dart test test/commands/tdd_json_stream_test.dart
