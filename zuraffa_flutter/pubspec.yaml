name: zuraffa_flutter
description: Flutter UI layer for Zuraffa — views, controllers, presenters, shells, xray, and state widgets.
version: 6.0.0
homepage: https://zuraffa.com
repository: https://github.com/arrrrny/zuraffa
issue_tracker: https://github.com/arrrrny/zuraffa/issues

topics:
  - clean-architecture
  - state-management
  - flutter
  - ui

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5+1
  responsive_builder: ^0.7.1
  go_router: ^17.2.3
  zuraffa: ^6.0.0
  yaml: ^3.1.0
  meta: ^1.17.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  # Transported VPC tests (issues #431 / #435) parse generated output with
  # package:analyzer and build fixture paths with package:path. Both are
  # already in the transitive graph but are declared directly here.
  analyzer: ^14.0.0
  path: ^1.9.1

dependency_overrides:
  analyzer: 14.1.0
  meta: ^1.19.0
  # Local dev only: the 6.0.0 core is not yet on pub, so resolve it from the
  # sibling package in this monorepo. Ignored for external consumers (overrides
  # from non-root packages don't apply), and the published `zuraffa: ^6.0.0`
  # constraint in `dependencies` is used there.
  zuraffa:
    path: ../
