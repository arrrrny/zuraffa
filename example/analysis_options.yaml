include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # Zorphy-generated code has known analysis issues on the development branch
    # (.copyWith named constructor nullable params, patchWithTodo `this` references).
    # These will be fixed in a future zorphy release.
    # See: https://github.com/arrrrny/zorphy/issues
    final_not_initialized_constructor: ignore
    missing_default_value_for_parameter: ignore
    invalid_reference_to_this: ignore
    dead_code: ignore
    dead_null_aware_expression: ignore
    undefined_method: ignore
    const_instance_field: ignore
    static_access_to_instance_member: ignore

linter:
  rules:
    avoid_renaming_method_parameters: false
