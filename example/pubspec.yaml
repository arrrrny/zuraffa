name: example
description: >-
  Example app demonstrating Zuraffa Clean Architecture — scaffolded
  entirely through zfa CLI commands (specs/031-scaffold-todo-example).

publish_to: none
version: 7.0.0

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  zuraffa:
    path: ../
  zorphy_annotation: ^2.3.0
  json_annotation: ^4.12.0
  hive_ce: ^2.19.0
  hive_ce_flutter: ^2.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  build_runner: ^2.15.2
  json_serializable: ^6.13.2
  hive_ce_generator: ^1.11.1

# Issue #1189: this app now resolves with ZERO dependency_overrides.
# The `meta: ^1.18.3` override from issue #891 was dropped: Flutter 3.47.x
# re-pinned meta to ^1.18.3, so the conflict the override worked around is
# gone (the old comment itself said to drop it once Flutter re-pins meta).
# The zuraffa-side fix for #1189 — moving `test` out of zuraffa's regular
# dependencies and widening analyzer to >=14.0.0 <15.0.0 — is what closes
# the solver failure that used to kill every `flutter pub get` recursing
# into this directory. tools/flutter_smoke_gate.sh re-proves this
# resolution on every CI run so the next constraint bump cannot silently
# break Flutter consumers again.

flutter:
  uses-material-design: true
