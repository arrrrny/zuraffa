name: example
description: >-
  Example app demonstrating Zuraffa Clean Architecture — scaffolded
  entirely through zfa CLI commands (specs/031-scaffold-todo-example).

publish_to: none
version: 7.0.0

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  zuraffa:
    path: ../
  zorphy_annotation: ^2.3.0
  json_annotation: ^4.12.0
  hive_ce: ^2.19.0
  hive_ce_flutter: ^2.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  build_runner: ^2.16.0
  json_serializable: ^6.13.2
  hive_ce_generator: ^1.11.1

flutter:
  uses-material-design: true
