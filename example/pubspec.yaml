name: example
description: >-
  Example app demonstrating Zuraffa Clean Architecture — scaffolded
  entirely through zfa CLI commands (specs/031-scaffold-todo-example).

publish_to: none
version: 6.2.2

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  zuraffa:
    path: ../
  zorphy_annotation: ^2.3.0
  json_annotation: ^4.12.0
  hive_ce: ^2.19.0
  hive_ce_flutter: ^2.3.4
  # Issue #965/#1133: the i18n-keyed widget contract — generated views
  # render through slang keys (t.auth.signIn) and the generated tests boot
  # the slang test shell (LocaleSettings + t accessor). slang's codegen
  # produces lib/i18n/strings.g.dart from the scaffolded
  # strings*.i18n.json files.
  slang: ^4.19.1
  # slang 4.x runtime split: the generated strings.g.dart imports
  # slang_flutter for LocaleSettings/TranslationProvider widgets.
  slang_flutter: ^4.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Issue #1370 (supersedes the #1369 `test` pin): NO published `test`
  # version resolves in this Flutter graph (#1189 conflict class) — the
  # gen side emits `package:flutter_test/flutter_test.dart` imports on
  # Flutter hosts instead (issue #1351). The coverage + mutation runners
  # stay: `tdd verify` needs them.
  # Issue #1400 (certification): a merge dropped this baseline's TDD
  # dev_dependencies and left the committed 004-login-ui verification.md
  # evidence unreproducible (`Could not find package 'mutation_test'`).
  # The pair was restored upstream (#1369, superseded by #1370 for the
  # `test` clause); this comment certifies it at HEAD by re-running the
  # evidence's scoped mutation audit against this tree
  # (killed=48, survived=8, score 0.8571, bit-exact vs the committed
  # evidence). Re-adding plain `test` re-breaks resolution (see #1370):
  # specs/1400-restore-verify-deps-example holds the full record.
  coverage: ^1.15.1
  mocktail: ^1.0.4
  build_runner: ^2.15.2
  json_serializable: ^6.13.2
  hive_ce_generator: ^1.11.1
  mutation_test: ^1.8.0

# Issue #1189: this app now resolves with ZERO dependency_overrides.
# The `meta: ^1.18.3` override from issue #891 was dropped: Flutter 3.47.x
# re-pinned meta to ^1.18.3, so the conflict the override worked around is
# gone (the old comment itself said to drop it once Flutter re-pins meta).
# The zuraffa-side fix for #1189 — moving `test` out of zuraffa's regular
# dependencies and widening analyzer to >=14.0.0 <15.0.0 — is what closes
# the solver failure that used to kill every `flutter pub get` recursing
# into this directory. tools/flutter_smoke_gate.sh re-proves this
# resolution on every CI run so the next constraint bump cannot silently
# break Flutter consumers again.

flutter:
  uses-material-design: true

