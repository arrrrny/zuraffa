targets:
  $default:
    builders:
      zorphy:zorphy:
        enabled: true
        generate_for:
          - lib/src/**

      source_gen:combining_builder:
        enabled: true

      hive_ce_generator:hive_adapters_generator:
        enabled: true
        generate_for:
          - lib/src/data/cache/**

      hive_ce_generator:hive_registrar_intermediate_generator:
        enabled: true
        generate_for:
          - lib/src/data/cache/**

      hive_ce_generator:hive_registrar_generator:
        enabled: true
