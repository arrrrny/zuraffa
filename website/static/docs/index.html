<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Docs — Zuraffa</title>
        <meta
            name="description"
            content="Zuraffa documentation — the AI-first Clean Architecture framework and CLI for Flutter. Entities, use cases, Result types, DI, MCP server and more."
        />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
            rel="stylesheet"
        />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css"
        />
        <style>
            :root {
                --bg: #1a1a1a;
                --bg-2: #141414;
                --code-bg: #0d0d0d;
                --accent: #ccff00;
                --accent-dim: #aacc00;
                --text: #f5f5f5;
                --dim: #9a9a9a;
                --border: #2c2c2c;
                --font-display: "Space Grotesk", system-ui, sans-serif;
                --font-mono: "JetBrains Mono", ui-monospace, monospace;
                --sidebar-w: 310px;
                --header-h: 56px;
            }

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            html {
                scroll-behavior: smooth;
                scroll-padding-top: calc(var(--header-h) + 16px);
            }

            body {
                background: var(--bg);
                color: var(--text);
                font-family: var(--font-display);
                line-height: 1.7;
                -webkit-font-smoothing: antialiased;
            }

            a {
                color: var(--accent);
                text-decoration: none;
            }

            a:hover {
                text-decoration: underline;
                text-underline-offset: 3px;
            }

            /* ---------- Header ---------- */
            header {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                height: var(--header-h);
                display: flex;
                align-items: center;
                gap: 1rem;
                padding: 0 1rem;
                background: rgba(20, 20, 20, 0.94);
                backdrop-filter: blur(10px);
                border-bottom: 1px solid var(--border);
                z-index: 50;
            }

            .brand {
                display: flex;
                align-items: center;
                gap: 0.5rem;
                font-weight: 700;
                font-size: 1.05rem;
                letter-spacing: -0.03em;
                color: var(--text);
                text-decoration: none;
                flex-shrink: 0;
            }

            .brand:hover {
                text-decoration: none;
                color: var(--accent);
            }

            .brand svg {
                width: 22px;
                height: 22px;
                fill: #e2a80e;
            }

            .brand-tag {
                font-family: var(--font-mono);
                font-size: 0.7rem;
                color: var(--bg);
                background: var(--accent);
                padding: 0.15rem 0.45rem;
                font-weight: 600;
                letter-spacing: 0.05em;
            }

            .header-spacer {
                flex: 1;
            }

            .search-wrap {
                position: relative;
                flex: 1;
                max-width: 380px;
            }

            #search {
                width: 100%;
                background: var(--bg);
                border: 1px solid var(--border);
                color: var(--text);
                font-family: var(--font-mono);
                font-size: 0.8rem;
                padding: 0.45rem 0.7rem 0.45rem 2rem;
                outline: none;
                transition: border-color 0.2s ease;
            }

            #search:focus {
                border-color: var(--accent);
            }

            .search-icon {
                position: absolute;
                left: 0.6rem;
                top: 50%;
                transform: translateY(-50%);
                color: var(--dim);
                font-size: 0.8rem;
                pointer-events: none;
            }

            .header-link {
                font-family: var(--font-mono);
                font-size: 0.78rem;
                color: var(--dim);
                flex-shrink: 0;
            }

            .header-link:hover {
                color: var(--accent);
            }

            .menu-btn {
                display: none;
                background: none;
                border: 1px solid var(--border);
                color: var(--text);
                font-family: var(--font-mono);
                font-size: 0.9rem;
                padding: 0.3rem 0.55rem;
                cursor: pointer;
                line-height: 1;
            }

            /* ---------- Layout ---------- */
            .layout {
                display: flex;
                padding-top: var(--header-h);
                min-height: 100vh;
            }

            /* ---------- Sidebar ---------- */
            aside {
                width: var(--sidebar-w);
                flex-shrink: 0;
                border-right: 1px solid var(--border);
                background: var(--bg-2);
                position: fixed;
                top: var(--header-h);
                bottom: 0;
                left: 0;
                overflow-y: auto;
                padding: 1.25rem 0 4rem;
            }

            aside::-webkit-scrollbar,
            .main::-webkit-scrollbar {
                width: 9px;
            }

            aside::-webkit-scrollbar-thumb,
            .main::-webkit-scrollbar-thumb {
                background: #333;
            }

            .nav-sec {
                margin-bottom: 0.35rem;
            }

            .nav-sec-title {
                font-family: var(--font-mono);
                font-size: 0.68rem;
                text-transform: uppercase;
                letter-spacing: 0.18em;
                color: var(--accent);
                padding: 0.85rem 1.25rem 0.35rem;
            }

            .nav-group-title {
                font-family: var(--font-mono);
                font-size: 0.7rem;
                color: var(--dim);
                padding: 0.55rem 1.25rem 0.2rem;
                font-weight: 500;
            }

            .nav-link {
                display: flex;
                align-items: baseline;
                gap: 0.5rem;
                padding: 0.34rem 1.25rem 0.34rem 1.5rem;
                font-size: 0.875rem;
                color: #c9c9c9;
                border-left: 2px solid transparent;
                line-height: 1.45;
            }

            .nav-group .nav-link {
                padding-left: 2rem;
            }

            .nav-link:hover {
                color: var(--accent);
                background: rgba(204, 255, 0, 0.04);
                text-decoration: none;
            }

            .nav-link.active {
                color: var(--accent);
                border-left-color: var(--accent);
                background: rgba(204, 255, 0, 0.06);
            }

            .nav-empty {
                padding: 1.5rem 1.25rem;
                font-family: var(--font-mono);
                font-size: 0.78rem;
                color: var(--dim);
            }

            /* ---------- Main ---------- */
            .main {
                flex: 1;
                min-width: 0;
                margin-left: var(--sidebar-w);
                display: flex;
                justify-content: center;
            }

            .article-wrap {
                width: 100%;
                max-width: 900px;
                padding: 2.5rem 3rem 6rem;
            }

            .crumbs {
                font-family: var(--font-mono);
                font-size: 0.72rem;
                color: var(--dim);
                text-transform: uppercase;
                letter-spacing: 0.12em;
                margin-bottom: 0.75rem;
            }

            .crumbs .lvl {
                color: var(--accent);
            }

            /* ---------- Markdown ---------- */
            .md h1 {
                font-size: 2.4rem;
                font-weight: 700;
                letter-spacing: -0.03em;
                line-height: 1.15;
                margin: 0 0 1.25rem;
            }

            .md h2 {
                font-size: 1.55rem;
                font-weight: 600;
                letter-spacing: -0.02em;
                margin: 2.5rem 0 0.85rem;
                padding-top: 1.25rem;
                border-top: 1px solid var(--border);
            }

            .md h3 {
                font-size: 1.18rem;
                font-weight: 600;
                margin: 1.9rem 0 0.6rem;
            }

            .md h4 {
                font-size: 1rem;
                font-weight: 600;
                margin: 1.5rem 0 0.5rem;
                color: #ddd;
            }

            .md p {
                margin: 0.9rem 0;
                color: #dcdcdc;
            }

            .md ul,
            .md ol {
                margin: 0.85rem 0 0.85rem 1.35rem;
                color: #dcdcdc;
            }

            .md li {
                margin: 0.3rem 0;
            }

            .md li > ul,
            .md li > ol {
                margin: 0.3rem 0 0.3rem 1.1rem;
            }

            .md strong {
                color: #fff;
                font-weight: 600;
            }

            .md em {
                color: #e8e8e8;
            }

            .md hr {
                border: none;
                border-top: 1px solid var(--border);
                margin: 2.5rem 0;
            }

            .md blockquote {
                border-left: 3px solid var(--accent);
                background: rgba(204, 255, 0, 0.04);
                padding: 0.6rem 1.1rem;
                margin: 1.2rem 0;
                color: #d5d5d5;
            }

            .md blockquote p {
                margin: 0.3rem 0;
            }

            .md img {
                max-width: 100%;
                border: 1px solid var(--border);
                margin: 1rem 0;
            }

            .md code {
                font-family: var(--font-mono);
                font-size: 0.84em;
                background: #262626;
                color: #e8e8e8;
                padding: 0.12em 0.4em;
                border-radius: 3px;
            }

            .md pre {
                background: var(--code-bg);
                border: 1px solid var(--border);
                border-radius: 6px;
                padding: 1rem 1.1rem;
                overflow-x: auto;
                margin: 1.2rem 0;
                line-height: 1.65;
            }

            .md pre code {
                background: none;
                padding: 0;
                font-size: 0.82rem;
                color: #d4d4d4;
            }

            .md table {
                width: 100%;
                border-collapse: collapse;
                margin: 1.4rem 0;
                font-size: 0.88rem;
                display: block;
                overflow-x: auto;
            }

            .md thead th {
                background: #232323;
                text-align: left;
                font-weight: 600;
                color: var(--accent);
                font-family: var(--font-mono);
                font-size: 0.75rem;
                text-transform: uppercase;
                letter-spacing: 0.06em;
                white-space: nowrap;
            }

            .md th,
            .md td {
                border: 1px solid var(--border);
                padding: 0.5rem 0.75rem;
                vertical-align: top;
            }

            .md tbody tr:nth-child(even) {
                background: rgba(255, 255, 255, 0.015);
            }

            .md .mermaid {
                background: var(--code-bg);
                border: 1px solid var(--border);
                border-radius: 6px;
                padding: 1.2rem;
                margin: 1.4rem 0;
                text-align: center;
                overflow-x: auto;
            }

            /* ---------- Pager ---------- */
            .pager {
                display: flex;
                gap: 1rem;
                margin-top: 4rem;
                padding-top: 1.5rem;
                border-top: 1px solid var(--border);
            }

            .pager a {
                flex: 1;
                border: 1px solid var(--border);
                padding: 0.85rem 1rem;
                color: var(--text);
                transition: border-color 0.2s ease;
            }

            .pager a:hover {
                border-color: var(--accent);
                text-decoration: none;
            }

            .pager a.next {
                text-align: right;
            }

            .pager .dir {
                display: block;
                font-family: var(--font-mono);
                font-size: 0.68rem;
                color: var(--dim);
                text-transform: uppercase;
                letter-spacing: 0.14em;
                margin-bottom: 0.3rem;
            }

            .pager .ttl {
                font-size: 0.92rem;
                color: var(--accent);
            }

            .pager .spacer {
                flex: 1;
            }

            .loading,
            .error {
                font-family: var(--font-mono);
                font-size: 0.85rem;
                color: var(--dim);
                padding: 3rem 0;
            }

            .error a {
                color: var(--accent);
            }

            footer.docs-foot {
                margin-top: 3.5rem;
                padding-top: 1.25rem;
                border-top: 1px solid var(--border);
                font-family: var(--font-mono);
                font-size: 0.75rem;
                color: var(--dim);
                display: flex;
                justify-content: space-between;
                gap: 1rem;
                flex-wrap: wrap;
            }

            /* ---------- Responsive ---------- */
            .backdrop {
                display: none;
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.6);
                z-index: 40;
            }

            @media (max-width: 1000px) {
                aside {
                    transform: translateX(-100%);
                    transition: transform 0.25s ease;
                    z-index: 45;
                    width: 300px;
                }

                body.nav-open aside {
                    transform: translateX(0);
                }

                body.nav-open .backdrop {
                    display: block;
                }

                .main {
                    margin-left: 0;
                }

                .article-wrap {
                    padding: 2rem 1.25rem 5rem;
                }

                .menu-btn {
                    display: block;
                }

                .header-link.hide-sm {
                    display: none;
                }
            }

            @media (max-width: 640px) {
                .md h1 {
                    font-size: 1.85rem;
                }

                .pager {
                    flex-direction: column;
                }

                .pager a.next {
                    text-align: left;
                }
            }
        </style>
    </head>

    <body>
        <header>
            <button class="menu-btn" id="menu-btn" aria-label="Toggle navigation">
                ☰
            </button>
            <a class="brand" href="/">
                <svg viewBox="0 0 200 200" aria-hidden="true">
                    <path
                        d="M40 30 L160 30 L40 170 L40 100 L120 100"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="14"
                        stroke-linecap="square"
                    />
                </svg>
                ZURAFFA
            </a>
            <span class="brand-tag">DOCS</span>
            <div class="header-spacer"></div>
            <div class="search-wrap">
                <span class="search-icon">⌕</span>
                <input
                    id="search"
                    type="search"
                    placeholder="Search docs…  (press /)"
                    autocomplete="off"
                    spellcheck="false"
                />
            </div>
            <a
                class="header-link hide-sm"
                href="https://github.com/arrrrny/zuraffa"
                target="_blank"
                rel="noopener"
                >GitHub ↗</a
            >
        </header>

        <div class="backdrop" id="backdrop"></div>

        <div class="layout">
            <aside id="sidebar">
                <nav id="nav"></nav>
            </aside>

            <div class="main">
                <div class="article-wrap">
                    <div class="crumbs" id="crumbs"></div>
                    <article class="md" id="content">
                        <p class="loading">Loading documentation…</p>
                    </article>
                    <nav class="pager" id="pager"></nav>
                    <footer class="docs-foot">
                        <span>© Zuraffa. MIT License.</span>
                        <span
                            >Docs generated from source — <span id="version"></span
                        ></span>
                    </footer>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
        <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
        <script>
            (function () {
                "use strict";

                var REPO = "https://github.com/arrrrny/zuraffa/blob/master/";

                var pages = [];
                var bySlug = {};
                var slugs = {};
                var current = null;

                var contentEl = document.getElementById("content");
                var navEl = document.getElementById("nav");
                var pagerEl = document.getElementById("pager");
                var crumbsEl = document.getElementById("crumbs");
                var versionEl = document.getElementById("version");
                var searchEl = document.getElementById("search");

                marked.setOptions({ gfm: true, breaks: false });

                function slugify(text) {
                    return String(text)
                        .toLowerCase()
                        .trim()
                        .replace(/[^\w\s-]/g, "")
                        .replace(/\s+/g, "-")
                        .replace(/-+/g, "-")
                        .replace(/^-|-$/g, "");
                }

                function esc(text) {
                    return String(text)
                        .replace(/&/g, "&amp;")
                        .replace(/</g, "&lt;")
                        .replace(/>/g, "&gt;")
                        .replace(/"/g, "&quot;");
                }

                /* ---------------- Sidebar ---------------- */

                function buildSidebar(meta) {
                    var html = "";
                    var section = null;
                    var group = null;
                    var openGroup = false;

                    meta.pages.forEach(function (p) {
                        var g = p.group || null;

                        if (p.section !== section) {
                            if (openGroup) {
                                html += "</div>";
                                openGroup = false;
                            }
                            section = p.section;
                            group = null;
                            html +=
                                '<div class="nav-sec"><div class="nav-sec-title">' +
                                esc(section) +
                                "</div>";
                        }

                        if (g !== group) {
                            if (openGroup) {
                                html += "</div>";
                                openGroup = false;
                            }
                            group = g;
                            if (group) {
                                html += '<div class="nav-group">';
                                html +=
                                    '<div class="nav-group-title">' +
                                    esc(group) +
                                    "</div>";
                                openGroup = true;
                            } else {
                                html += '<div class="nav-group">';
                                openGroup = true;
                            }
                        }

                        html +=
                            '<a class="nav-link" href="#/' +
                            encodeURIComponent(p.slug) +
                            '" data-slug="' +
                            esc(p.slug) +
                            '" data-title="' +
                            esc(p.title.toLowerCase()) +
                            '">' +
                            esc(p.title) +
                            "</a>";
                    });

                    if (openGroup) {
                        html += "</div>";
                    }

                    navEl.innerHTML = html;
                }

                function markActive(slug) {
                    var links = navEl.querySelectorAll(".nav-link");
                    for (var i = 0; i < links.length; i++) {
                        links[i].classList.toggle(
                            "active",
                            links[i].getAttribute("data-slug") === slug,
                        );
                    }
                    var active = navEl.querySelector(".nav-link.active");
                    if (active && active.scrollIntoView) {
                        active.scrollIntoView({ block: "nearest" });
                    }
                }

                function filterNav(query) {
                    var q = query.trim().toLowerCase();
                    var groups = navEl.querySelectorAll(".nav-group");

                    for (var g = 0; g < groups.length; g++) {
                        var group = groups[g];
                        var links = group.querySelectorAll(".nav-link");
                        var visible = 0;

                        for (var i = 0; i < links.length; i++) {
                            var link = links[i];
                            var title = link.getAttribute("data-title") || "";
                            var match =
                                q === "" ||
                                title.indexOf(q) !== -1 ||
                                title.replace(/[^a-z0-9]/g, " ").indexOf(q) !==
                                    -1;
                            link.style.display = match ? "" : "none";
                            if (match) visible++;
                        }

                        var groupTitle = group.querySelector(".nav-group-title");
                        if (groupTitle) {
                            groupTitle.style.display = visible ? "" : "none";
                        }
                        group.style.display = visible ? "" : "none";
                    }

                    var secs = navEl.querySelectorAll(".nav-sec");
                    for (var s = 0; s < secs.length; s++) {
                        var shown = secs[s].querySelector(
                            '.nav-group:not([style*="display: none"])',
                        );
                        secs[s].style.display = shown ? "" : "none";
                    }

                    var any = navEl.querySelector(
                        '.nav-link:not([style*="display: none"])',
                    );
                    if (!any && q !== "") {
                        if (!navEl.querySelector(".nav-empty")) {
                            var empty = document.createElement("div");
                            empty.className = "nav-empty";
                            empty.textContent = "No pages match “" + query + "”";
                            navEl.appendChild(empty);
                        }
                    } else {
                        var existing = navEl.querySelector(".nav-empty");
                        if (existing) existing.remove();
                    }
                }

                /* ---------------- Link rewriting ---------------- */

                function rewriteLinks(root) {
                    var links = root.querySelectorAll("a[href]");

                    for (var i = 0; i < links.length; i++) {
                        var a = links[i];
                        var href = a.getAttribute("href");
                        if (!href) continue;

                        if (/^(https?:|mailto:|tel:|data:)/i.test(href)) {
                            a.setAttribute("target", "_blank");
                            a.setAttribute("rel", "noopener");
                            continue;
                        }

                        if (href.charAt(0) === "#") continue;

                        var parts = href.split("#");
                        var path = parts[0].replace(/^\.\//, "").replace(/^\/+/, "");
                        var anchor = parts.length > 1 ? parts[1] : "";
                        if (!path) continue;

                        var hasExt = /\.[a-z0-9]{1,6}$/i.test(path);

                        if (hasExt) {
                            a.setAttribute("href", REPO + path + (anchor ? "#" + anchor : ""));
                            a.setAttribute("target", "_blank");
                            a.setAttribute("rel", "noopener");
                            continue;
                        }

                        var slug = path
                            .replace(/\.md$/i, "")
                            .replace(/[^a-z0-9-]/gi, "");
                        if (slugs[slug]) {
                            a.setAttribute("href", "#/" + encodeURIComponent(slug));
                            continue;
                        }

                        a.setAttribute("href", REPO + path);
                        a.setAttribute("target", "_blank");
                        a.setAttribute("rel", "noopener");
                    }
                }

                function addHeadingIds(root) {
                    var seen = {};
                    var headings = root.querySelectorAll("h2, h3, h4");

                    for (var i = 0; i < headings.length; i++) {
                        var h = headings[i];
                        if (h.id) continue;
                        var base = slugify(h.textContent) || "section";
                        var id = base;
                        var n = 1;
                        while (seen[id]) id = base + "-" + n++;
                        seen[id] = true;
                        h.id = id;
                    }
                }

                /* ---------------- Render ---------------- */

                function renderMermaid(root) {
                    var blocks = root.querySelectorAll("code.language-mermaid");
                    var nodes = [];

                    for (var i = 0; i < blocks.length; i++) {
                        var code = blocks[i];
                        var pre = code.parentNode;
                        var div = document.createElement("div");
                        div.className = "mermaid";
                        div.textContent = code.textContent;
                        pre.parentNode.replaceChild(div, pre);
                        nodes.push(div);
                    }

                    if (!nodes.length) return Promise.resolve();
                    if (typeof mermaid === "undefined") return Promise.resolve();

                    return mermaid
                        .run({ nodes: nodes })
                        .catch(function () {
                            /* leave source visible if a diagram fails */
                        });
                }

                function highlight(root) {
                    if (typeof hljs === "undefined") return;
                    var blocks = root.querySelectorAll("pre code");
                    for (var i = 0; i < blocks.length; i++) {
                        if (blocks[i].classList.contains("language-mermaid")) continue;
                        try {
                            hljs.highlightElement(blocks[i]);
                        } catch (e) {
                            /* non-fatal */
                        }
                    }
                }

                function ensureTitle(page) {
                    if (contentEl.querySelector("h1")) return;
                    if (!page.title) return;
                    var h1 = document.createElement("h1");
                    h1.textContent = page.title;
                    contentEl.insertBefore(h1, contentEl.firstChild);
                }

                function renderCrumbs(page) {
                    var bits = [];
                    if (page.section) bits.push(esc(page.section));
                    if (page.group) bits.push(esc(page.group));
                    var tail = page.level
                        ? '<span class="lvl">' + esc(page.level) + "</span>"
                        : "";
                    bits.push(tail);
                    crumbsEl.innerHTML = bits
                        .filter(function (b) {
                            return b;
                        })
                        .join(" · ");
                }

                function renderPager(slug) {
                    var idx = pages.map(function (p) {
                        return p.slug;
                    }).indexOf(slug);
                    var prev = idx > 0 ? pages[idx - 1] : null;
                    var next = idx > -1 && idx < pages.length - 1 ? pages[idx + 1] : null;

                    var html = "";
                    if (prev) {
                        html +=
                            '<a class="prev" href="#/' +
                            encodeURIComponent(prev.slug) +
                            '"><span class="dir">← Previous</span><span class="ttl">' +
                            esc(prev.title) +
                            "</span></a>";
                    } else {
                        html += '<span class="spacer"></span>';
                    }
                    if (next) {
                        html +=
                            '<a class="next" href="#/' +
                            encodeURIComponent(next.slug) +
                            '"><span class="dir">Next →</span><span class="ttl">' +
                            esc(next.title) +
                            "</span></a>";
                    } else {
                        html += '<span class="spacer"></span>';
                    }
                    pagerEl.innerHTML = html;
                }

                var loadToken = 0;

                function loadPage(slug) {
                    var page = bySlug[slug];
                    if (!page) return;

                    var token = ++loadToken;
                    current = slug;

                    markActive(slug);
                    renderCrumbs(page);
                    renderPager(slug);
                    document.title = page.title + " — Zuraffa Docs";
                    contentEl.innerHTML = '<p class="loading">Loading…</p>';

                    if (location.hash !== "#/" + encodeURIComponent(slug)) {
                        var url = "#/" + encodeURIComponent(slug);
                        try {
                            history.replaceState(null, "", url);
                        } catch (e) {
                            location.hash = url;
                        }
                    }

                    fetch(page.file, { cache: "no-cache" })
                        .then(function (res) {
                            if (!res.ok) throw new Error("HTTP " + res.status);
                            return res.text();
                        })
                        .then(function (md) {
                            if (token !== loadToken) return;
                            contentEl.innerHTML = marked.parse(md);
                            ensureTitle(page);
                            rewriteLinks(contentEl);
                            addHeadingIds(contentEl);
                            highlight(contentEl);
                            renderMermaid(contentEl);
                            window.scrollTo({ top: 0, behavior: "auto" });
                            closeNav();
                        })
                        .catch(function (err) {
                            if (token !== loadToken) return;
                            contentEl.innerHTML =
                                '<p class="error">Could not load this page (' +
                                esc(err.message) +
                                ").<br /><br />Try the <a href=\"/\">landing page</a> or " +
                                '<a href="https://github.com/arrrrny/zuraffa" target="_blank" rel="noopener">GitHub</a>.</p>';
                        });
                }

                /* ---------------- Routing ---------------- */

                function route() {
                    var hash = location.hash;

                    if (!hash || hash === "#") {
                        if (!current && pages.length) loadPage(pages[0].slug);
                        return;
                    }

                    if (hash.indexOf("#/") !== 0) {
                        var el = document.getElementById(
                            decodeURIComponent(hash.slice(1)),
                        );
                        if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
                        return;
                    }

                    var slug = decodeURIComponent(hash.slice(2));
                    if (bySlug[slug]) {
                        if (slug !== current) loadPage(slug);
                    } else if (pages.length) {
                        loadPage(pages[0].slug);
                    }
                }

                /* ---------------- Mobile nav ---------------- */

                function closeNav() {
                    document.body.classList.remove("nav-open");
                }

                document.getElementById("menu-btn").addEventListener("click", function () {
                    document.body.classList.toggle("nav-open");
                });

                document.getElementById("backdrop").addEventListener("click", closeNav);

                /* ---------------- Search ---------------- */

                searchEl.addEventListener("input", function () {
                    filterNav(searchEl.value);
                });

                searchEl.addEventListener("keydown", function (e) {
                    if (e.key === "Escape") {
                        searchEl.value = "";
                        filterNav("");
                        searchEl.blur();
                    }
                    if (e.key === "Enter") {
                        var first = navEl.querySelector(
                            '.nav-link:not([style*="display: none"])',
                        );
                        if (first) first.click();
                    }
                });

                document.addEventListener("keydown", function (e) {
                    if (e.key === "/" && document.activeElement !== searchEl) {
                        e.preventDefault();
                        document.body.classList.add("nav-open");
                        searchEl.focus();
                    }
                });

                /* ---------------- Boot ---------------- */

                window.addEventListener("hashchange", route);

                fetch("wiki.json", { cache: "no-cache" })
                    .then(function (res) {
                        if (!res.ok) throw new Error("HTTP " + res.status);
                        return res.json();
                    })
                    .then(function (meta) {
                        pages = meta.pages || [];
                        pages.forEach(function (p) {
                            bySlug[p.slug] = p;
                            slugs[p.slug] = true;
                        });

                        versionEl.textContent = meta.id || "";
                        document.documentElement.setAttribute(
                            "data-version",
                            meta.id || "",
                        );

                        buildSidebar(meta);

                        if (typeof mermaid !== "undefined") {
                            mermaid.initialize({
                                startOnLoad: false,
                                theme: "base",
                                fontFamily: "JetBrains Mono, monospace",
                                themeVariables: {
                                    background: "#0d0d0d",
                                    primaryColor: "#1f1f1f",
                                    primaryTextColor: "#f5f5f5",
                                    primaryBorderColor: "#ccff00",
                                    lineColor: "#666666",
                                    secondaryColor: "#262626",
                                    tertiaryColor: "#1a1a1a",
                                    fontSize: "14px",
                                },
                            });
                        }

                        route();
                    })
                    .catch(function (err) {
                        contentEl.innerHTML =
                            '<p class="error">Could not load the documentation index (' +
                            esc(err.message) +
                            ").<br /><br />Return to the <a href=\"/\">landing page</a>.</p>";
                    });
            })();
        </script>
    </body>
</html>
