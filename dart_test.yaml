# Zuraffa test tiers
# ------------------
# `dart test` runs only the FAST unit suite. The slow tiers are excluded by
# default (tagged `slow`); every slow test also carries a tier tag:
# `regression`, `integration`, `property`, `benchmark`.
#
# Full suite (heavy, full-local baseline only — NOT for CI / cloud agents):
#   dart test --preset=all
# CI and cloud/CI agents run the default fast tier (`dart test`). --preset=all
# also runs every slow tier (regression/integration/property/benchmark); each
# spins up temp projects that run `dart pub get` + `build_runner` and can fill
# several GB under /tmp, so avoid it on small/disposable agents.
# Run a single slow tier:
#   dart test --preset=regression
#   dart test --preset=integration
#   dart test --preset=property
#   dart test --preset=benchmark
# Run a semantic folder (fast feedback):
#   dart test test/core
#   dart test test/plugins/route
#   dart test test/commands
#
# Concurrency cap
# ---------------
# Many regression/integration tests spin up a throwaway temp project and run
# `dart pub get` + `build_runner build` (each accumulates a populated
# `.dart_tool` + AOT snapshot in /tmp), and a `dart run build_runner build`
# spawns a heavy AOT compile of `build.dart` that can use several GB of RAM.
# At the dart-test default concurrency (== number of cores, often 8-16 on
# cloud agents) those heavy compiles coincide, exhaust RAM, and OOM-kill the
# test runner's other concurrent compile isolates — surfacing as hundreds of
# silent "Failed to load" errors for unrelated suites. Capping parallelism
# bounds both the peak disk footprint and the RAM pressure so a fresh
# `dart test --preset=all` completes green instead of running out of space or
# memory. Lower this further (to 1) on very small disks / low-RAM agents.

concurrency: 2

# Declare every suite-level tag so a test using one never prints the
# "A tag was used that wasn't specified in dart_test.yaml" warning. The default
# run excludes `slow`; the slow tiers are selected by the presets below.
tags:
  slow:
  flutter:
  regression:
  integration:
  property:
  benchmark:

exclude_tags: slow

presets:
  all:
    exclude_tags: "false"
  regression:
    include_tags: regression
    exclude_tags: "false"
  integration:
    include_tags: integration
    exclude_tags: "false"
  property:
    include_tags: property
    exclude_tags: "false"
  benchmark:
    include_tags: benchmark
    exclude_tags: "false"
  flutter:
    include_tags: flutter
    exclude_tags: "false"
