# Zuraffa test tiers
# ------------------
# `dart test` runs only the FAST unit suite. The slow tiers are excluded by
# default (tagged `slow`); every slow test also carries a tier tag:
# `regression`, `integration`, `property`, `benchmark`.
#
# Run the full suite (CI / pre-commit):
#   dart test --preset=all
# Run a single slow tier:
#   dart test --preset=regression
#   dart test --preset=integration
#   dart test --preset=property
#   dart test --preset=benchmark
# Run a semantic folder (fast feedback):
#   dart test test/core
#   dart test test/plugins/route
#   dart test test/commands
#
# Concurrency cap
# ---------------
# Many regression/integration tests spin up a throwaway temp project and run
# `dart pub get` + `build_runner build` (each accumulates a populated
# `.dart_tool` + AOT snapshot in /tmp). At the dart-test default concurrency
# (== number of cores, often 8-16 on cloud agents) those caches coexist and
# can exhaust a constrained agent disk mid-run ("Unable to write file:
# .../.dart_tool/build/entrypoint/build.dart.aot"). Capping parallelism bounds
# the peak disk footprint so a fresh `dart test --preset=all` completes
# instead of running out of space. Lower this further on very small disks.

concurrency: 3

exclude_tags: slow

presets:
  all:
    exclude_tags: "false"
  regression:
    include_tags: regression
    exclude_tags: "false"
  integration:
    include_tags: integration
    exclude_tags: "false"
  property:
    include_tags: property
    exclude_tags: "false"
  benchmark:
    include_tags: benchmark
    exclude_tags: "false"
